# Fly.io config for Garage Trip Chores.
# `app` is set by `fly launch`; change it if the name is taken.
app = "garage-trip-chores"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/chores.db"
  # Upstream defaults are baked into app/config.py; override here if needed.
  # CHORES_API_BASE = "https://chores.garage-trip.cz"
  # CHORES_WS_URL   = "wss://chores.garage-trip.cz/ws"
  # CHILDREN_COUNT  = "5"

# Single always-on instance: it holds an in-memory cache and a persistent
# upstream WebSocket, so we must NOT autoscale or scale to zero.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

# Persistent disk for SQLite (profiles, claims, templates, departures).
[[mounts]]
  source = "chores_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8080
  method = "get"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
