# fly.toml app configuration file generated for garage-trip-chores on 2026-08-16T21:40:42+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'garage-trip-chores'
primary_region = 'fra'

[build]
[env]
  DB_PATH = '/data/chores.db'
  DISCORD_CALLBACK_URL = 'https://garage-trip-chores.fly.dev/auth/discord/callback'
  AUTH_REQUIRED = 'true'

[[mounts]]
  source = 'chores_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
